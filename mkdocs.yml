site_name: Pillar6
site_description: Production infrastructure for agentic AI. Any framework. Full visibility.
site_url: https://callensw.github.io/Pillar6/
repo_url: https://github.com/callensw/Pillar6
repo_name: callensw/Pillar6

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
    - Add to Existing Agents: getting-started/wrapping.md
    - Installation: getting-started/installation.md
    - Build from Scratch: getting-started/quickstart.md
    - Concepts: getting-started/concepts.md
  - Integrations:
    - LangChain: integrations/langchain.md
    - CrewAI: integrations/crewai.md
    - Anthropic SDK: integrations/anthropic-sdk.md
    - OpenAI SDK: integrations/openai-sdk.md
  - Pillars:
    - Context Management: pillars/context-management.md
    - Tool Orchestration: pillars/tool-orchestration.md
    - Security: pillars/security.md
    - Routing: pillars/routing.md
    - Observability: pillars/observability.md
    - Evaluation: pillars/evaluation.md
  - Patterns:
    - ReAct: patterns/react.md
    - Plan-Execute: patterns/plan-execute.md
    - Supervisor: patterns/supervisor.md
  - API Reference: api/reference.md
  - Contributing: contributing.md
