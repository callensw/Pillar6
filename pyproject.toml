[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pillar6"
version = "0.1.0"
description = "Production infrastructure for agentic AI. Observability, security, cost tracking, and evaluation for any agent framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Pillar6 Contributors" },
]
keywords = ["ai", "agents", "llm", "observability", "production", "monitoring", "langchain", "crewai", "security", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "typer>=0.9",
]

[project.scripts]
pillar6 = "pillar6.cli.main:app"

[project.urls]
Homepage = "https://github.com/callensw/Pillar6"
Documentation = "https://callensw.github.io/Pillar6"
Repository = "https://github.com/callensw/Pillar6"
Issues = "https://github.com/callensw/Pillar6/issues"

[project.optional-dependencies]
langchain = ["langchain>=0.1"]
crewai = ["crewai>=0.1"]
all = ["langchain>=0.1", "crewai>=0.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.setuptools.packages.find]
include = ["pillar6*"]

[tool.setuptools.package-data]
pillar6 = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["N999", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
